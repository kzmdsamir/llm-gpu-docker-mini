services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-mini-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - DEFAULT_MODEL=qwen3.5:9b
      - REQUEST_TIMEOUT=180
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

